extends: low_density_after_no_traffic.yaml

experiment:
  name: low_density_improved

environment:
  traffic_reward_config:
    commitment_enabled: true
    decision_risk_threshold: 0.08
    comfortable_deceleration: 4.0
    stopping_buffer: 3.0
    go_tcpa_threshold: 1.4
    decision_hold_steps: 25
    intersection_go_speed: 32.0
    weights:
      # The state machine decides whether braking or acceleration is safer.
      yield_braking: 0.15
      decision_compliance: 1.0
      decision_violation: 1.2

training:
  total_timesteps: 750000
