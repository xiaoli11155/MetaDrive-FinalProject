extends: v3_imitation.yaml

experiment:
  name: low_density_after_no_traffic

environment:
  custom_smooth_reward: false
  traffic_aware_reward: true
  control_smoothing: null
  traffic_density: 0.08
  random_traffic: true

  success_reward: 200.0
  crash_vehicle_penalty: 120.0
  crash_object_penalty: 100.0
  out_of_road_penalty: 100.0
  crash_sidewalk_penalty: 0.0

  traffic_reward_config:
    straight_target_speed: 45.0
    curve_target_speed: 25.0
    intersection_yield_speed: 12.0
    motion_gate_speed: 5.0
    traffic_query_distance: 50.0
    adaptive_speed_distance: 35.0
    minimum_gap: 5.0
    time_headway: 1.8
    gap_recovery_gain: 0.8
    safe_ttc: 4.0
    conflict_horizon: 5.0
    conflict_distance: 6.0
    weights:
      progress: 1.0
      lane_keeping: 0.25
      heading: 0.15
      speed_tracking: 0.25
      steering_smooth: 0.05
      throttle_smooth: 0.05
      safe_headway: 0.35
      yield_braking: 0.6
      traffic_risk: 1.5
      unsafe_acceleration: 1.0

training:
  total_timesteps: 1000000
  learning_rate: 0.00005
  ent_coef: 0.001
  checkpoint_freq: 50000

evaluation:
  episodes: 30
  start_seed: 1000

video:
  seed: 1000
