experiment:
  name: v3_smooth_turning

seed: 44

environment:
  num_scenarios: 300
  start_seed: 0
  traffic_density: 0.0
  random_traffic: false
  map: 3
  horizon: 1000
  truncate_as_terminate: false
  use_render: false
  image_observation: false

  custom_smooth_reward: true
  control_smoothing:
    alpha: 0.3
    max_delta: 0.25

  success_reward: 200.0
  out_of_road_penalty: 50.0
  crash_vehicle_penalty: 50.0
  crash_object_penalty: 50.0
  # Sidewalk contact can persist for many steps without termination when
  # out_of_route_done is enabled. Keep this at zero to avoid repeated spikes;
  # lateral/heading costs already penalize leaving the lane continuously.
  crash_sidewalk_penalty: 0.0
  driving_reward: 1.0
  speed_reward: 0.0
  use_lateral_reward: true
  out_of_route_done: true

  lateral_penalty: 0.2
  heading_penalty: 0.3
  steering_penalty: 0.02
  steering_change_penalty: 0.05
  curve_overspeed_penalty: 0.3
  straight_target_speed: 35.0
  curve_target_speed: 18.0
  minimum_speed: 5.0
  idle_penalty: 0.1
  speed_tracking_reward: 0.2

  vehicle_config:
    lidar:
      num_lasers: 120
      distance: 50
      num_others: 4
    show_lidar: false

training:
  total_timesteps: 1000000
  learning_rate: 0.00015
  n_steps: 2048
  batch_size: 256
  n_epochs: 8
  gamma: 0.995
  gae_lambda: 0.95
  clip_range: 0.15
  ent_coef: 0.01
  checkpoint_freq: 50000

evaluation:
  episodes: 30
  start_seed: 1000
  deterministic: true

video:
  enabled: true
  seed: 1000
  fps: 10
  frame_interval: 2
  screen_size: 512
  max_steps: 1000
